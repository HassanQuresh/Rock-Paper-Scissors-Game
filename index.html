<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Rock-Paper-Scissors</title>
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="player-move rock-btn"><img src="rock-emoji.png" class="img"></button>
    <button class="player-move paper-btn"><img src="paper-emoji.png" class="img"></button>
    <button class="player-move scissors-btn"><img src="scissors-emoji.png" class="img"></button>
    <p class="result"></p>
    <p class="moves"></p>
    <p class="score"></p>
    <button class="reset">Reset Score</button>
    <button class="reset auto">Auto Play</button>
    <div class="decision"></div>
  <script src="script.js"></script>
</body>
</html>
